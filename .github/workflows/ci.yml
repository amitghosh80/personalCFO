name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      # Fast, network-free suite only. conftest.py self-generates ENCRYPTION_KEY
      # and uses an isolated in-memory SQLite engine, so no secrets/services needed.
      #
      # Deliberately excluded:
      #   - test_qa_eval.py: needs a live ANTHROPIC_API_KEY (cost + flakiness).
      #   - test_income_classification.py: needs real PDF statement fixtures
      #     that aren't checked into the repo.
      - run: pytest tests/test_analytics.py tests/test_chat_service.py tests/test_chat_router.py tests/test_insight_smoke.py -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
